name: Rebuild TAMU Linux 1.0D

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils tesseract-ocr e2fsprogs shellcheck
      - name: Check scripts
        run: |
          python3 -m py_compile tools/build.py
          bash -n run.sh
          shellcheck run.sh
          shellcheck -s sh -e SC2002,SC2006 tamu-fetch
      - name: Rebuild and smoke-test from original media
        run: python3 tools/build.py
      - name: Keep logs and screenshots, never the original media or VM disk
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tamu-rebuild-evidence
          path: |
            build/session-*/build.log
            build/session-*/qemu-*.log
            build/session-*/evidence/*.png
            build/session-*/evidence/*.txt
            build/session-*/manifest.json
          if-no-files-found: warn
